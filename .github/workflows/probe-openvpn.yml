name: probe-openvpn

# Disposable capability probe v5: fix log polling (chmod log after daemon start),
# detect init quickly, then run autovpn.sh-style + routed egress checks.
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn curl jq netcat-openbsd dnsutils >/dev/null
          openvpn --version | head -n 1
      - name: Fetch configs and test
        run: |
          set +e
          curl -fsSL https://github.com/shirakun/vpn-gate-openvpn-udp/releases/latest/download/udp.json -o /tmp/udp.json || exit 1
          python3 - <<'PY'
          import json, base64, re
          data = json.load(open('/tmp/udp.json'))
          for row in data:
              if '#HostName' in row:
                  row['HostName'] = row.pop('#HostName')
          jp = [r for r in data
                if r.get('CountryShort') == 'JP'
                and not (r.get('HostName') or '').startswith('public-vpn')
                and r.get('OpenVPN_ConfigData_Base64')]
          jp.sort(key=lambda r: int(r.get('Score') or 0), reverse=True)
          cands = jp[:3]
          print('servers=%d jp=%d trying=%d' % (len(data), len(jp), len(cands)))
          for i, r in enumerate(cands):
              cfg = base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode('utf-8', 'replace')
              m = re.search(r'^remote\s+(\S+)\s+(\d+)', cfg, re.M)
              p = re.search(r'^proto\s+(\w+)', cfg, re.M)
              with open('/tmp/c%02d.ovpn' % i, 'w', newline='\n') as f:
                  f.write(cfg)
              print('c%02d host=%s proto=%s remote=%s:%s score=%s' % (
                  i, r.get('HostName'), p.group(1) if p else '?',
                  m.group(1) if m else '?', m.group(2) if m else '?', r.get('Score')))
          PY
          OK=0; EGRESS_OK=0
          for ovpn in /tmp/c0*.ovpn; do
            [ -f "$ovpn" ] || continue
            IP=$(grep -m1 '^remote ' "$ovpn" | awk '{print $2}')
            PORT=$(grep -m1 '^remote ' "$ovpn" | awk '{print $3}')
            PROTO=$(grep -m1 '^proto ' "$ovpn" | awk '{print $2}')
            echo "================ $ovpn ($PROTO $IP:$PORT) ================"
            if [ "$PROTO" = "tcp" ]; then
              if timeout 6 nc -z -w 5 "$IP" "$PORT" 2>/dev/null; then echo ">>> raw-tcp: OPEN"; else echo ">>> raw-tcp: CLOSED"; fi
            fi
            sudo rm -f /tmp/vpn.log
            sed -i '/^[[:space:]]*client[[:space:]]*$/a route-nopull' "$ovpn"
            sudo openvpn --config "$ovpn" --daemon --log /tmp/vpn.log \
                --verb 3 --connect-retry 1 --connect-timeout 8 --auth-nocache \
                --user nobody --group nogroup
            sudo chmod 666 /tmp/vpn.log
            START=$SECONDS
            UP=0
            while [ $((SECONDS-START)) -lt 45 ]; do
              if grep -q "Initialization Sequence Completed" /tmp/vpn.log 2>/dev/null; then UP=1; break; fi
              if ! pgrep -x openvpn >/dev/null 2>&1; then break; fi
              sleep 2
            done
            echo ">>> elapsed=$((SECONDS-START))s up=$UP"
            if [ "$UP" = "1" ]; then
              OK=$((OK+1))
              echo ">>> init-sequence: OK"
              ip -4 addr show tun0 2>/dev/null | grep -E 'inet ' || true
              echo ">>> egress A (autovpn parity: curl --interface tun0):"
              EGRESS=$(curl --interface tun0 --max-time 8 -sS https://api64.ipify.org 2>/dev/null)
              if [ -n "$EGRESS" ]; then echo ">>> egress A via tun0: $EGRESS"; else echo ">>> egress A: NONE"; fi
              echo ">>> egress B (route target via tun0 then curl --interface tun0):"
              DST=$(getent ahostsv4 api64.ipify.org | awk 'NR==1{print $1}')
              echo "    target ip=$DST"
              if [ -n "$DST" ]; then
                sudo ip route add "$DST/32" dev tun0 2>/dev/null
                EGRESS2=$(curl --interface tun0 --max-time 12 -sS https://api64.ipify.org 2>/dev/null)
                if [ -n "$EGRESS2" ]; then
                  EGRESS_OK=$((EGRESS_OK+1))
                  echo ">>> egress B via tun0: $EGRESS2"
                  curl -sS --max-time 8 "http://ip-api.com/json/$EGRESS2?fields=status,message,country,countryCode,query" || true
                  echo
                else
                  echo ">>> egress B: NONE"
                fi
                sudo ip route del "$DST/32" dev tun0 2>/dev/null
              fi
            else
              echo ">>> init-sequence: FAILED (still_alive=$(pgrep -x openvpn >/dev/null && echo yes || echo no))"
            fi
            echo "--- vpn.log (matched) ---"
            grep -E 'PUSH_REPLY|ifconfig|Initialization Sequence|AUTH|TLS Error|Fatal|Options error|SIGTERM|exiting' /tmp/vpn.log 2>/dev/null | tail -n 12
            sudo pkill -x openvpn 2>/dev/null
            sleep 2
          done
          echo "ALL_DONE init_ok=$OK egress_ok=$EGRESS_OK"
          exit 0