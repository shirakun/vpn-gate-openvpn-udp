name: probe-openvpn

# Disposable capability probe v2: can a GitHub-hosted runner install OpenVPN,
# create a tun device and actually connect through VPN Gate servers?
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check tun capability
        run: |
          set -x
          uname -a
          id
          echo "--- runner public ip ---"
          curl -sS --max-time 15 https://api64.ipify.org; echo
          echo "--- /dev/net/tun ---"
          ls -l /dev/net/tun || true
          sudo modprobe tun 2>&1 || true
          sudo mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200 2>&1 || true; fi
          ls -l /dev/net/tun || true
          echo "--- explicit mktun test ---"
          sudo openvpn --mktun --dev tun9 --dev-type tun 2>&1 || echo MKTUN_FAILED
          ip -4 addr show tun9 2>&1 || true
          sudo openvpn --rmtun --dev tun9 2>&1 || true
      - name: Install openvpn
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn curl jq >/dev/null
          openvpn --version | head -n 1
      - name: Fetch configs and test
        run: |
          set +e
          curl -fsSL https://github.com/shirakun/vpn-gate-openvpn-udp/releases/latest/download/udp.json -o /tmp/udp.json || exit 1
          python3 - <<'PY'
          import json, base64
          data = json.load(open('/tmp/udp.json'))
          for row in data:
              if '#HostName' in row:
                  row['HostName'] = row.pop('#HostName')
          cands = [r for r in data
                   if r.get('CountryShort') == 'JP'
                   and not (r.get('HostName') or '').startswith('public-vpn')
                   and r.get('OpenVPN_ConfigData_Base64')]
          cands.sort(key=lambda r: int(r.get('UdpPort') or 0), reverse=True)
          print('servers=%d jp_candidates=%d' % (len(data), len(cands)))
          for i, r in enumerate(cands[:3]):
              name = r.get('HostName') or r.get('IP')
              with open('/tmp/t%02d.ovpn' % i, 'wb') as f:
                  f.write(base64.b64decode(r['OpenVPN_ConfigData_Base64']))
              print('wrote t%02d.ovpn host=%s udp=%s tcp=%s score=%s' % (i, name, r.get('UdpPort'), r.get('TcpPort'), r.get('Score')))
          PY
          echo "--- configs header lines ---"
          for ovpn in /tmp/t00.ovpn /tmp/t01.ovpn /tmp/t02.ovpn; do
            [ -f "$ovpn" ] || continue
            echo "### $ovpn"
            grep -E '^(client|remote|port|proto|dev|dev-type|route|redirect-gateway|auth-user-pass|auth )' "$ovpn" | head -n 12
          done
          FAIL=0
          for ovpn in /tmp/t00.ovpn /tmp/t01.ovpn /tmp/t02.ovpn; do
            [ -f "$ovpn" ] || continue
            echo "================ $ovpn ================"
            sed -i '/^[[:space:]]*client[[:space:]]*$/a route-nopull' "$ovpn"
            sudo rm -f /tmp/vpn.log
            sudo openvpn --config "$ovpn" --daemon --log /tmp/vpn.log \
                --verb 3 --connect-retry 1 --connect-timeout 8 --auth-nocache
            UP=0
            for i in $(seq 1 30); do
              if grep -q "Initialization Sequence Completed" /tmp/vpn.log 2>/dev/null; then UP=1; break; fi
              if ! pgrep -x openvpn >/dev/null 2>&1; then break; fi
              sleep 2
            done
            if [ "$UP" = "1" ]; then
              echo ">>> init-sequence: OK"
              ip -4 addr show tun0 2>/dev/null | grep -E 'inet ' || true
              EGRESS=$(curl --interface tun0 --max-time 15 -sS https://api64.ipify.org 2>/dev/null)
              if [ -n "$EGRESS" ]; then
                echo ">>> egress via tun0: $EGRESS"
                curl -sS --max-time 10 "http://ip-api.com/json/$EGRESS?fields=status,message,country,countryCode,query" || true
                echo
              else
                echo ">>> egress via tun0: NONE (tunnel not usable)"
              fi
            else
              echo ">>> init-sequence: FAILED"
              echo "--- full vpn.log ---"
              sudo cat /tmp/vpn.log 2>&1 | tail -n 40
              FAIL=1
            fi
            sudo pkill -x openvpn 2>/dev/null
            sleep 2
          done
          echo "ALL_DONE fail=$FAIL"
          exit 0