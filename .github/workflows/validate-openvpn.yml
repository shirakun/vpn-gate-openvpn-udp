name: validate-openvpn

# 验证当前 udp.json 中每个 OpenVPN 配置的连通性和可用性。
# 判定方式与 autovpn.sh 一致:注入 route-nopull -> 连接成功
# (Initialization Sequence Completed) -> tun0 出现 ->
# curl --interface tun0 出网成功。
# 出网成功的节点,再在隧道内用 MediaUnlockTest(unlock-test) 检测
# Netflix(地区)/Abema/動畫瘋(Bahamut Anime)/ChatGPT 解锁情况。
# 每个节点的验证结果汇总写入 MySQL(连接信息通过仓库 Secrets 注入,不写死凭据)。
# 仅在 workflow_dispatch 时运行(不会在每次 push 时触发,无 commit-back 回环)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "验证范围: jp = autovpn.sh 使用的日本节点; all = 全部节点"
        type: choice
        options:
          - jp
          - all
        default: jp
      max_nodes:
        description: "最多验证几个节点(0 = 范围内全部)"
        type: number
        default: 0
      timeout_per_node:
        description: "单个节点最长等待秒数"
        type: number
        default: 25

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn curl jq netcat-openbsd default-mysql-client >/dev/null
          openvpn --version | head -n 1
          mysql --version
      - name: Install unlock-test
        run: |
          curl -fsSL --max-time 60 https://unlock.icmp.ing/test/latest/unlock-test_linux_amd64 -o /tmp/unlock-test \
            || curl -fsSL --max-time 60 https://github.com/HsukqiLee/MediaUnlockTest/releases/download/v1.9.9-1788067938/unlock-test_linux_amd64 -o /tmp/unlock-test
          chmod +x /tmp/unlock-test
          sudo mv /tmp/unlock-test /usr/local/bin/unlock-test
          unlock-test -v 2>&1 | head -n 2 || true
      - name: Fetch current node list
        run: |
          curl -fsSL https://github.com/shirakun/vpn-gate-openvpn-udp/releases/latest/download/udp.json -o /tmp/udp.json || exit 1
          echo "total_rows=$(jq length /tmp/udp.json)"
      - name: Validate each config
        id: validate
        env:
          SCOPE: ${{ github.event.inputs.scope }}
          MAX_NODES: ${{ github.event.inputs.max_nodes }}
          TIMEOUT_PER_NODE: ${{ github.event.inputs.timeout_per_node }}
        run: |
          set +e
          SCOPE="${SCOPE:-jp}"
          MAX_NODES="${MAX_NODES:-0}"
          TIMEOUT_PER_NODE="${TIMEOUT_PER_NODE:-25}"
          case "$SCOPE" in jp|all) ;; *) SCOPE=jp ;; esac
          export SCOPE MAX_NODES
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          # unlock-test 输出解析:按前缀取首个匹配行(输入已去色),去掉前缀与冒号
          pick() {
            awk -v p="$1" 'index($0,p)==1 { s=substr($0,length(p)+1); sub(/^[[:space:]]*:?[[:space:]]*/,"",s); print s; exit }'
          }
          # 摘要展示:含 "(Region: X)" 只保留地区 X;空值显示 '-'
          compact() {
            local t="$1" r
            r=$(printf '%s' "$t" | sed -nE 's/^.*\(Region:[[:space:]]*([^)]*)\).*$/\1/p')
            if [ -n "$r" ]; then printf '%s' "$r"; elif [ -n "$t" ]; then printf '%s' "$t"; else printf '%s' '-'; fi
          }
          python3 - <<'PY'
          import os, json, re, base64
          scope = os.environ['SCOPE']
          try:
              maxn = int(os.environ.get('MAX_NODES', '0') or 0)
          except ValueError:
              maxn = 0
          data = json.load(open('/tmp/udp.json'))
          for row in data:
              if '#HostName' in row:
                  row['HostName'] = row.pop('#HostName')
          def is_public(r):
              return (r.get('HostName') or '').startswith('public-vpn')
          def num(v):
              try:
                  return int(v or 0)
              except (TypeError, ValueError):
                  return 0
          if scope == 'jp':
              cands = [r for r in data if r.get('CountryShort') == 'JP' and not is_public(r)
                       and r.get('OpenVPN_ConfigData_Base64')]
              # 与 autovpn.sh 一致:按 UdpPort 降序
              cands.sort(key=lambda r: num(r.get('UdpPort')), reverse=True)
          else:
              cands = [r for r in data if not is_public(r)
                       and r.get('OpenVPN_ConfigData_Base64')]
              cands.sort(key=lambda r: num(r.get('Score')), reverse=True)
          if maxn and maxn > 0:
              cands = cands[:maxn]
          with open('/tmp/cands.txt', 'w') as f:
              for i, r in enumerate(cands):
                  cfg = base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode('utf-8', 'replace')
                  m = re.search(r'^remote\s+(\S+)\s+(\d+)', cfg, re.M)
                  p = re.search(r'^proto\s+(\w+)', cfg, re.M)
                  ip = m.group(1) if m else ''
                  port = m.group(2) if m else ''
                  proto = p.group(1) if p else '?'
                  host = r.get('HostName') or r.get('IP') or ''
                  cc = r.get('CountryShort') or '?'
                  with open('/tmp/vpn_%d.ovpn' % i, 'w', newline='\n') as g:
                      g.write(cfg)
                  f.write('%d\t%s\t%s\t%s\t%s\t%s\n' % (i, cc, host, ip, port, proto))
          print('scope=%s candidates=%d' % (scope, len(cands)))
          PY
          TOTAL=0; OK=0; FAIL=0; SKIP=0
          : > /tmp/results.tsv
          while IFS=$'\t' read -r IDX CC HOST IP PORT PROTO; do
            [ -n "$IDX" ] || continue
            OVPN="/tmp/vpn_${IDX}.ovpn"
            TOTAL=$((TOTAL+1))
            NF='-'; ABEMA='-'; BAHAMUT='-'; GPT='-'
            echo "================ [$TOTAL] $CC $HOST ($PROTO $IP:$PORT) ================"
            if [ "$PROTO" = "tcp" ]; then
              if timeout 6 nc -z -w 5 "$IP" "$PORT" 2>/dev/null; then
                echo ">>> raw-tcp: OPEN"
              else
                echo ">>> raw-tcp: CLOSED (skip)"
                printf '%s\t%s\t%s\t%s\t%s\t%s\tport_closed\t-\t0\t%s\t%s\t%s\t%s\n' "$TOTAL" "$CC" "$HOST" "$PROTO" "$IP" "$PORT" "$NF" "$ABEMA" "$BAHAMUT" "$GPT" >> /tmp/results.tsv
                SKIP=$((SKIP+1))
                continue
              fi
            fi
            LOG="/tmp/vpn_${IDX}.log"
            sudo rm -f "$LOG"
            sed -i '/^[[:space:]]*client[[:space:]]*$/a route-nopull' "$OVPN"
            sudo openvpn --config "$OVPN" --daemon --log "$LOG" \
                --verb 3 --connect-retry 1 --connect-timeout 8 --auth-nocache \
                --user nobody --group nogroup
            sudo chmod 666 "$LOG" 2>/dev/null
            START=$SECONDS
            UP=0
            while [ $((SECONDS-START)) -lt "$TIMEOUT_PER_NODE" ]; do
              if grep -q "Initialization Sequence Completed" "$LOG" 2>/dev/null; then UP=1; break; fi
              if ! pgrep -x openvpn >/dev/null 2>&1; then break; fi
              sleep 2
            done
            ELAPSED=$((SECONDS-START))
            EGRESS=""
            if [ "$UP" = "1" ]; then
              EGRESS=$(curl --interface tun0 --max-time 8 -sS https://api64.ipify.org 2>/dev/null)
            fi
            if [ -n "$EGRESS" ]; then
              echo ">>> RESULT: OK  egress=$EGRESS  (${ELAPSED}s)"
              # 隧道内检测流媒体/GPT 解锁(出口绑定 tun0)
              UNLOCK_RAW=$(sudo timeout 90 unlock-test -I tun0 -m 4 \
                -test 'Netflix,Abema,Bahamut Anime,OpenAI ChatGPT' 2>&1 || true)
              UNLOCK_OUT=$(printf '%s\n' "$UNLOCK_RAW" | sed -r $'s/\x1B\[[0-9;]*[mK]//g')
              NF=$(printf '%s\n' "$UNLOCK_OUT" | pick 'Netflix')
              [ -n "$NF" ] || NF='-'
              ABEMA=$(printf '%s\n' "$UNLOCK_OUT" | pick 'Abema')
              [ -n "$ABEMA" ] || ABEMA='-'
              BAHAMUT=$(printf '%s\n' "$UNLOCK_OUT" | pick 'Bahamut Anime')
              [ -n "$BAHAMUT" ] || BAHAMUT='-'
              GPT=$(printf '%s\n' "$UNLOCK_OUT" | pick 'OpenAI ChatGPT')
              if [ -z "$GPT" ]; then GPT=$(printf '%s\n' "$UNLOCK_OUT" | pick 'ChatGPT'); fi
              [ -n "$GPT" ] || GPT='-'
              echo ">>> UNLOCK: Netflix=[$NF] Abema=[$ABEMA] Bahamut=[$BAHAMUT] ChatGPT=[$GPT]"
              printf '%s\t%s\t%s\t%s\t%s\t%s\tok\t%s\t%s\t%s\t%s\t%s\t%s\n' "$TOTAL" "$CC" "$HOST" "$PROTO" "$IP" "$PORT" "$EGRESS" "$ELAPSED" "$NF" "$ABEMA" "$BAHAMUT" "$GPT" >> /tmp/results.tsv
              OK=$((OK+1))
            else
              if [ "$UP" = "1" ]; then
                echo ">>> RESULT: FAIL  (init ok 但出网失败, ${ELAPSED}s)"
                ST="no_egress"
              elif pgrep -x openvpn >/dev/null 2>&1; then
                echo ">>> RESULT: FAIL  (超时未连上, ${ELAPSED}s)"
                ST="timeout"
              else
                echo ">>> RESULT: FAIL  (openvpn 退出, ${ELAPSED}s)"
                ST="died"
              fi
              grep -E 'AUTH_FAILED|TLS Error|Fatal|Options error|Cannot|exiting' "$LOG" 2>/dev/null | tail -n 5
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t-\t%s\t%s\t%s\t%s\t%s\n' "$TOTAL" "$CC" "$HOST" "$PROTO" "$IP" "$PORT" "$ST" "$ELAPSED" "$NF" "$ABEMA" "$BAHAMUT" "$GPT" >> /tmp/results.tsv
              FAIL=$((FAIL+1))
            fi
            sudo pkill -x openvpn 2>/dev/null
            sleep 2
          done < /tmp/cands.txt
          echo "================ 汇总 ================"
          echo "total=$TOTAL ok=$OK fail=$FAIL skipped=$SKIP"
          echo "ALL_DONE ok=$OK fail=$FAIL skipped=$SKIP total=$TOTAL"
          {
            echo "## OpenVPN 节点验证结果 (scope=$SCOPE)"
            echo
            echo "| # | 国家 | 主机 | 协议 | 服务器:端口 | 结果 | 出口IP | Netflix | Abema | 動畫瘋 | ChatGPT | 耗时(s) |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            while IFS=$'\t' read -r N CC HOST PROTO IP PORT ST EGRESS EL NF ABEMA BAHAMUT GPT; do
              case "$ST" in
                ok) EMOJI=":white_check_mark:" ;;
                port_closed) EMOJI=":no_entry_sign:" ;;
                *) EMOJI=":x:" ;;
              esac
              printf '| %s | %s | %s | %s | %s:%s | %s %s | %s | %s | %s | %s | %s | %s |\n' \
                "$N" "$CC" "$HOST" "$PROTO" "$IP" "$PORT" "$EMOJI" "$ST" "$EGRESS" "$(compact "$NF")" "$(compact "$ABEMA")" "$(compact "$BAHAMUT")" "$(compact "$GPT")" "$EL"
            done < /tmp/results.tsv
            echo
            echo "**total=$TOTAL, ok=$OK, fail=$FAIL, skipped(端口关闭)=$SKIP**"
          } >> "$GITHUB_STEP_SUMMARY"
          # 全部失败视为 workflow 失败,便于在 Actions 页面直接看到
          if [ "$TOTAL" -gt 0 ] && [ "$OK" -eq 0 ]; then exit 1; fi
          exit 0
      - name: Store results to MySQL
        if: always()
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MYSQL_PWD: ${{ secrets.DB_PASS }}
          RUN_ID: ${{ github.run_id }}
          SCOPE: ${{ steps.validate.outputs.scope }}
        run: |
          set -e
          : "${DB_HOST:?缺少 Secret: DB_HOST}"
          : "${DB_USER:?缺少 Secret: DB_USER}"
          : "${DB_NAME:?缺少 Secret: DB_NAME}"
          : "${MYSQL_PWD:?缺少 Secret: DB_PASS}"
          echo "== store results -> $DB_HOST / $DB_NAME (run=$RUN_ID scope=${SCOPE:-?}) =="
          python3 - <<'PY'
          import os
          run_id = os.environ['RUN_ID']
          scope = (os.environ.get('SCOPE', '') or '').strip()
          def clean(v):
              return '' if v == '-' else v
          def esc(v):
              return v.replace('\\', '\\\\').replace("'", "\\'").replace('\x00', '')
          def sval(v):
              return "'%s'" % esc(clean(v))
          def ival(v):
              v = clean(v)
              try:
                  return str(int(v))
              except (TypeError, ValueError):
                  return 'NULL'
          ddl_lines = [
              "CREATE TABLE IF NOT EXISTS vpn_validate_results (",
              "  id INT UNSIGNED NOT NULL AUTO_INCREMENT,",
              "  run_id BIGINT NOT NULL,",
              "  scope VARCHAR(32) NOT NULL DEFAULT '',",
              "  idx INT NOT NULL DEFAULT 0,",
              "  cc VARCHAR(8) NOT NULL DEFAULT '',",
              "  host VARCHAR(255) NOT NULL DEFAULT '',",
              "  proto VARCHAR(8) NOT NULL DEFAULT '',",
              "  ip VARCHAR(64) NOT NULL DEFAULT '',",
              "  port INT NULL,",
              "  status VARCHAR(16) NOT NULL DEFAULT '',",
              "  egress VARCHAR(64) NOT NULL DEFAULT '',",
              "  elapsed INT NULL,",
              "  netflix VARCHAR(128) NOT NULL DEFAULT '',",
              "  abema VARCHAR(128) NOT NULL DEFAULT '',",
              "  bahamut VARCHAR(128) NOT NULL DEFAULT '',",
              "  chatgpt VARCHAR(128) NOT NULL DEFAULT '',",
              "  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,",
              "  PRIMARY KEY (id),",
              "  UNIQUE KEY uq_run_idx (run_id, idx)",
              ") ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;",
          ]
          cols = "run_id, scope, idx, cc, host, proto, ip, port, status, egress, elapsed, netflix, abema, bahamut, chatgpt"
          sql = []
          sql.append("SET NAMES utf8mb4;")
          sql.append("\n".join(ddl_lines))
          sql.append("DELETE FROM vpn_validate_results WHERE run_id = %s;" % run_id)
          try:
              tsv = open('/tmp/results.tsv', encoding='utf-8').read()
          except OSError:
              tsv = ''
          nrow = 0
          for line in tsv.splitlines():
              f = line.split('\t')
              if len(f) < 9:
                  continue
              f = (f + [''] * 13)[:13]
              idx, cc, host, proto, ip, port, status, egress, elapsed = f[:9]
              nf, abema, bahamut, gpt = f[9:13]
              vals = [run_id, sval(scope), ival(idx), sval(cc), sval(host), sval(proto), sval(ip),
                      ival(port), sval(status), sval(egress), ival(elapsed),
                      sval(nf), sval(abema), sval(bahamut), sval(gpt)]
              sql.append("INSERT INTO vpn_validate_results (%s) VALUES (%s);" % (cols, ', '.join(vals)))
              nrow += 1
          with open('/tmp/db_inserts.sql', 'w', encoding='utf-8') as fh:
              fh.write("\n".join(sql) + "\n")
          print('generated rows=%d' % nrow)
          PY
          mysql --host="$DB_HOST" --user="$DB_USER" --default-character-set=utf8mb4 --connect-timeout=20 "$DB_NAME" < /tmp/db_inserts.sql
          CNT=$(mysql --host="$DB_HOST" --user="$DB_USER" --batch --skip-column-names --default-character-set=utf8mb4 -e "SELECT COUNT(*) FROM vpn_validate_results WHERE run_id=$RUN_ID" "$DB_NAME")
          echo "mysql_rows=$CNT (run=$RUN_ID scope=${SCOPE:-?})"
          mysql --host="$DB_HOST" --user="$DB_USER" --table --default-character-set=utf8mb4 -e "SELECT idx, cc, host, proto, ip, status, netflix, abema, bahamut, chatgpt FROM vpn_validate_results WHERE run_id=$RUN_ID ORDER BY idx" "$DB_NAME"
